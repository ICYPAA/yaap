appId: com.themindfulpug.icypaa
name: Accommodations, services, and safety
tags:
  - smoke
  - services
  - safety
---
- clearState
- clearKeychain
- setPermissions:
    permissions:
      notifications: deny
- launchApp
- openLink: "exp+icypaa://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081"
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
- runFlow:
    when:
      visible: "Close"
    commands:
      - tapOn: "Close"
- extendedWaitUntil:
    visible: "Welcome to YAAP!"
    timeout: 20000
- tapOn:
    id: "tutorial-skip"
- extendedWaitUntil:
    visible: "Safety & Anonymity"
    timeout: 10000
- tapOn:
    id: "safety-acknowledge"
- extendedWaitUntil:
    visible: "Local Test Conference"
    timeout: 20000
- tapOn:
    id: "tab-accommodations"
- extendedWaitUntil:
    visible: "Venue Amenities"
    timeout: 15000
- assertVisible:
    id: "venue-map-0"
- tapOn:
    id: "venue-map-0"
- extendedWaitUntil:
    visible:
      id: "venue-map-viewer"
    timeout: 15000
- takeScreenshot: "venue-map-open"
- doubleTapOn:
    id: "venue-map-viewer"
- waitForAnimationToEnd
- assertVisible:
    id: "venue-map-viewer-close"
- takeScreenshot: "venue-map-zoomed"
- tapOn:
    id: "venue-map-viewer-close"
- assertVisible: "Registration and Information"
- scrollUntilVisible:
    element:
      text: "Local Test Cafe"
    direction: DOWN
    timeout: 15000
- assertVisible: "Local Test Cafe"
- scrollUntilVisible:
    element:
      text: "River Walk"
    direction: DOWN
    timeout: 15000
- assertVisible: "River Walk"
- tapOn:
    id: "tab-services"
- extendedWaitUntil:
    visible:
      id: "service-card-accessibility"
    timeout: 15000
- assertVisible:
    id: "service-card-volunteer"
- tapOn:
    id: "service-card-volunteer"
- extendedWaitUntil:
    visible: "Your name"
    timeout: 10000
- tapOn:
    id: "volunteer-back"
- scrollUntilVisible:
    element:
      id: "service-card-accessibility"
    direction: UP
    timeout: 10000
- tapOn:
    id: "service-card-accessibility"
- extendedWaitUntil:
    visible:
      id: "accessibility-name"
    timeout: 10000
- tapOn:
    id: "accessibility-name"
- inputText: "Maestro Tester"
- tapOn:
    id: "accessibility-phone"
- inputText: "6125550100"
- tapOn:
    id: "accessibility-email"
- inputText: "maestro@yaap.local"
- swipe:
    start: "50%, 55%"
    end: "50%, 30%"
    duration: 400
- tapOn:
    id: "accessibility-need-type"
- inputText: "Mobility"
- swipe:
    start: "50%, 55%"
    end: "50%, 30%"
    duration: 400
- tapOn:
    id: "accessibility-arrival"
- inputText: "Tomorrow"
- swipe:
    start: "50%, 55%"
    end: "50%, 35%"
    duration: 400
- tapOn:
    id: "accessibility-duration"
- inputText: "Full conference"
- swipe:
    start: "50%, 55%"
    end: "50%, 35%"
    duration: 400
- tapOn:
    id: "accessibility-submit"
- extendedWaitUntil:
    visible: "Thank you for your request!"
    timeout: 15000
- back
- tapOn:
    id: "tab-safety"
- extendedWaitUntil:
    visible: "Everyone deserves a safe and welcoming conference."
    timeout: 15000
- assertVisible: "Harassment is not tolerated."
- tapOn:
    id: "safety-policy-toggle"
- assertNotVisible: "Harassment is not tolerated."
- tapOn:
    id: "safety-policy-toggle"
- assertVisible: "Harassment is not tolerated."
- scrollUntilVisible:
    element:
      text: ".*safety@yaap.local.*"
    direction: DOWN
    timeout: 10000
- assertVisible: ".*safety@yaap.local.*"
