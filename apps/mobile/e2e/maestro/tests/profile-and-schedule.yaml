appId: com.themindfulpug.icypaa
name: Create a profile and save an event
tags:
  - smoke
  - profile
  - schedule
---
- clearState
- clearKeychain
- setPermissions:
    permissions:
      notifications: deny
- launchApp
- openLink: "exp+icypaa://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081"
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
- runFlow:
    when:
      visible: "Close"
    commands:
      - tapOn: "Close"
- extendedWaitUntil:
    visible: "Welcome to YAAP!"
    timeout: 20000
- tapOn:
    id: "tutorial-skip"
- extendedWaitUntil:
    visible: "Safety & Anonymity"
    timeout: 10000
- tapOn:
    id: "safety-acknowledge"
- extendedWaitUntil:
    visible: "Local Test Conference"
    timeout: 20000
- tapOn:
    id: "tab-profile"
- extendedWaitUntil:
    visible: "Create Profile"
    timeout: 15000
- tapOn:
    id: "profile-first-name"
- inputText: "Maestro"
- tapOn:
    id: "profile-last-initial"
- inputText: "T"
- hideKeyboard
- tapOn:
    id: "profile-create"
- extendedWaitUntil:
    visible: "My Profile"
    timeout: 15000
- tapOn:
    id: "tab-program"
- extendedWaitUntil:
    visible: ".*Opening Celebration.*"
    timeout: 15000
- tapOn:
    id: "program-save-event-9201"
- tapOn:
    id: "program-view-my-schedule"
- assertVisible: ".*Opening Celebration.*"
- assertVisible: ".*Main Ballroom.*"
- scrollUntilVisible:
    element:
      id: "schedule-share-qr"
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: "schedule-share-qr"
- swipe:
    start: "50%, 80%"
    end: "50%, 45%"
    duration: 500
- takeScreenshot: "schedule-sharing-qr"
